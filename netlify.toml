# Netlify deploy configuration
# Build step injects SANITY_TOKEN from env vars into js/config.js

[build]
  command = "node scripts/generate-config.js"
  publish = "."

# Redirects & rewrites
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security & performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
